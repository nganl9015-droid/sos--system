<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống SOS 2026 - Bản Hoàn Thiện</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --blue: #2563eb; --red: #ef4444; --green: #22c55e; --dark: #0f172a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--dark); margin: 0; color: #1e293b; }
        
        /* LOGIN */
        #login-page { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); position: fixed; width: 100%; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .tab-group { display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; cursor: pointer; border-radius: 10px; font-weight: 600; color: #64748b; }
        .tab.active { background: white; color: var(--blue); }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; background: var(--blue); transition: 0.2s; }
        
        /* COMMON UI */
        .header { padding: 18px; border-radius: 15px; text-align: center; color: white; margin: 20px; position: relative; font-weight: bold; }
        .safe-bg { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .danger-bg { background: linear-gradient(135deg, #ef4444, #b91c1c); animation: flash 1s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .logout-btn { position: absolute; right: 15px; top: 13px; background: rgba(255,255,255,0.2); border: 1px solid white; padding: 5px 12px; border-radius: 8px; font-size: 11px; color: white; cursor: pointer; }

        /* DASHBOARDS */
        #dash-personal, #dash-admin { display: none; min-height: 100vh; }
        #dash-personal { padding: 0 20px 20px 20px; background: #f8fafc; }
        #dash-admin { flex-direction: row; background: #f1f5f9; }
        .grid-p { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        #map-p { width: 100%; height: 350px; border-radius: 12px; }

        /* HISTORY NO TABLE */
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { padding: 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .history-item:last-child { border: none; }
        .danger-text { color: var(--red); font-weight: bold; }

        /* ADMIN SIDEBAR */
        .sidebar-admin { width: 300px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .admin-item { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .admin-item.danger { background: #fff1f2; border-left: 4px solid var(--red); }
        #map-admin { flex: 1; height: 100vh; }
        #logs { background: #1e293b; color: #38bdf8; padding: 12px; height: 120px; overflow-y: auto; border-radius: 12px; font-size: 11px; font-family: monospace; }
        
        @media (max-width: 850px) { .grid-p { grid-template-columns: 1fr; } #dash-admin { flex-direction: column; } .sidebar-admin { width: 100%; height: 35%; } }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-box">
            <h2 style="margin-bottom: 10px;">Hệ Thống SOS 2026</h2>
            <div class="tab-group">
                <div class="tab active" id="t-l" onclick="setMode('login')">Đăng nhập</div>
                <div class="tab" id="t-r" onclick="setMode('reg')">Đăng ký</div>
            </div>
            <input type="text" id="u_id" class="inp" placeholder="ID xe hoặc 'admin'">
            <input type="password" id="u_pw" class="inp" placeholder="Mật khẩu">
            <button class="btn" id="b-auth" onclick="handleAuth()">XÁC THỰC TRUY CẬP</button>
            <p id="auth-err" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <div id="dash-personal">
        <div id="st-header" class="header safe-bg">
            <span id="st-text"><i class="fas fa-shield-alt"></i> XE: <span id="disp-id"></span> | AN TOÀN</span>
            <div class="logout-btn" onclick="location.reload()">Đăng xuất</div>
        </div>
        <div class="grid-p">
            <div class="left">
                <div class="card">
                    <h3 style="margin-top:0">Vị trí hiện tại</h3>
                    <div id="map-p"></div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0">Lịch sử sự cố</h3>
                    <div id="h-list" class="history-list">
                        <div style="color:#64748b; font-size:13px; text-align:center; padding:10px;">Chưa có dữ liệu sự cố</div>
                    </div>
                </div>
            </div>
            <div class="right">
                <div class="card">
                    <h3 style="margin-top:0">Cài đặt SĐT Cứu Hộ</h3>
                    <input type="text" id="p1" class="inp" placeholder="Số điện thoại 1">
                    <input type="text" id="p2" class="inp" placeholder="Số điện thoại 2">
                    <button class="btn" onclick="saveSdt()">CẬP NHẬT 2 SỐ</button>
                </div>
                <div class="card">
                    <h3 style="margin-top:0">Bảng Điều Khiển</h3>
                    <button class="btn" style="background:#334155" onclick="sendReset()">XÁC NHẬN AN TOÀN (RESET)</button>
                </div>
                <div class="card">
                    <h3 style="margin-top:0">Console Log</h3>
                    <div id="logs"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="dash-admin">
        <div class="sidebar-admin">
            <div style="padding: 20px; background: var(--dark); color: white; position:relative;">
                <h3 style="margin:0">QUẢN TRỊ VIÊN</h3>
                <small>Giám sát: <span id="admin-count">0</span> xe</small>
                <div class="logout-btn" style="top:18px" onclick="location.reload()">Thoát</div>
            </div>
            <div id="admin-list" style="flex:1; overflow-y:auto;"></div>
        </div>
        <div id="map-admin"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyChyZAmeBu2WLwsEzVrWFULbTYpl-nG0fE",
            authDomain: "hethongsos.firebaseapp.com",
            databaseURL: "https://hethongsos-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hethongsos",
            storageBucket: "hethongsos.appspot.com",
            messagingSenderId: "922952133122",
            appId: "1:922952133122:web:8da5b17a64aa7c7954551b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let mqtt, mapP, markerP, mapA, curID = "", mode = "login", hasL = false, listA = {};

        function setMode(m) {
            mode = m;
            document.getElementById('t-l').className = (m === 'login' ? 'tab active' : 'tab');
            document.getElementById('t-r').className = (m === 'reg' ? 'tab active' : 'tab');
            document.getElementById('b-auth').innerText = (m === 'login' ? 'ĐĂNG NHẬP' : 'ĐĂNG KÝ');
        }

        function handleAuth() {
            const id = document.getElementById('u_id').value.trim();
            const pw = document.getElementById('u_pw').value.trim();
            if(!id || !pw) return;
            if(id === "admin" && pw === "12345") { initAdmin(); return; }
            if(mode === 'reg') {
                db.ref('users/'+id).set({password:pw, sdt1:"", sdt2:""}).then(()=> {alert("Đăng ký thành công!"); setMode('login');});
            } else {
                db.ref('users/'+id).once('value').then(s => {
                    const d = s.val();
                    if(d && (d.pw === pw || d.password === pw)) { curID = id; initP(d); }
                    else document.getElementById('auth-err').innerText = "Sai tài khoản hoặc mật khẩu!";
                });
            }
        }

        function initP(d) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dash-personal').style.display = 'block';
            document.getElementById('disp-id').innerText = curID;
            mapP = L.map('map-p').setView([21.0285, 105.8542], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapP);
            markerP = L.marker([21.0285, 105.8542]).addTo(mapP);
            document.getElementById('p1').value = d.sdt1 || "";
            document.getElementById('p2').value = d.sdt2 || "";
            startMqtt("personal");
        }

        function initAdmin() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dash-admin').style.display = 'flex';
            mapA = L.map('map-admin').setView([21.0285, 105.8542], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapA);
            startMqtt("admin");
        }

        function startMqtt(m_type) {
            mqtt = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + Math.random());
            mqtt.onMessageArrived = (m) => {
                const p = m.payloadString;
                const t = m.destinationName;
                if(m_type === "personal") {
                    if(p.startsWith("danger")) {
                        const pts = p.split('|');
                        onDanger(parseFloat(pts[1]), parseFloat(pts[2]));
                    } else if(p === "safe") { onSafe(); }
                } else {
                    const id = t.split('/')[1];
                    updateAdmin(id, p);
                }
            };
            mqtt.connect({useSSL:true, onSuccess: () => {
                if(m_type === "personal") mqtt.subscribe(`sos_system/${curID}/data`);
                else mqtt.subscribe("sos_system/+/data");
                addLog("Máy chủ MQTT: Đã kết nối");
            }});
        }

        function onDanger(lat, lng) {
            document.getElementById('st-header').className = "header danger-bg";
            document.getElementById('st-text').innerHTML = '<i class="fas fa-exclamation-triangle"></i> CẢNH BÁO TAI NẠN!';
            markerP.setLatLng([lat, lng]); mapP.panTo([lat, lng]);
            if(!hasL) {
                const list = document.getElementById('h-list');
                if(list.innerText.includes("Chưa có")) list.innerHTML = "";
                const item = `<div class="history-item">
                    <span>${new Date().toLocaleTimeString()} - <span class="danger-text">TAI NẠN</span></span>
                    <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" style="color:var(--blue); text-decoration:none;"><i class="fas fa-external-link-alt"></i> Xem bản đồ</a>
                </div>`;
                list.insertAdjacentHTML('afterbegin', item);
                hasL = true;
            }
        }

        function onSafe() {
            document.getElementById('st-header').className = "header safe-bg";
            document.getElementById('st-text').innerHTML = `<i class="fas fa-shield-alt"></i> XE: ${curID} | AN TOÀN`;
            hasL = false;
        }

        function saveSdt() {
            const s1 = document.getElementById('p1').value.trim();
            const s2 = document.getElementById('p2').value.trim();
            db.ref('users/'+curID).update({sdt1:s1, sdt2:s2}).then(() => {
                if(mqtt && mqtt.isConnected()) {
                    const msg = new Paho.MQTT.Message("setphone:" + s1 + "," + s2);
                    msg.destinationName = `sos_system/${curID}/lenh`;
                    mqtt.send(msg);
                    addLog("Đã cập nhật 2 SĐT: " + s1 + ", " + s2);
                    alert("Đã đồng bộ 2 số cứu hộ!");
                }
            });
        }

        function sendReset() {
            if(mqtt && mqtt.isConnected()) {
                const msg = new Paho.MQTT.Message("reset_system");
                msg.destinationName = `sos_system/${curID}/lenh`;
                mqtt.send(msg);
                onSafe();
                addLog("Gửi lệnh Reset hệ thống");
            }
        }

        function updateAdmin(id, p) {
            if(!listA[id]) {
                listA[id] = { marker: L.marker([21.0285, 105.8542]).addTo(mapA).bindPopup("Xe: "+id), lat:21.0285, lng:105.8542 };
                const item = `<div id="adm-${id}" class="admin-item" onclick="mapA.flyTo([${listA[id].lat}, ${listA[id].lng}], 16)">
                    <b>Xe: ${id}</b><br><small id="ads-${id}" style="color:var(--green)">Trạng thái: Bình thường</small>
                </div>`;
                document.getElementById('admin-list').insertAdjacentHTML('beforeend', item);
            }
            if(p.startsWith("danger")) {
                const pts = p.split('|');
                listA[id].lat = pts[1]; listA[id].lng = pts[2];
                listA[id].marker.setLatLng([pts[1], pts[2]]);
                document.getElementById('adm-'+id).className = "admin-item danger";
                document.getElementById('ads-'+id).innerText = "CẢNH BÁO: TAI NẠN!";
                document.getElementById('ads-'+id).style.color = "var(--red)";
                document.getElementById('admin-list').prepend(document.getElementById('adm-'+id));
            } else {
                document.getElementById('adm-'+id).className = "admin-item";
                document.getElementById('ads-'+id).innerText = "Trạng thái: Bình thường";
                document.getElementById('ads-'+id).style.color = "var(--green)";
            }
            document.getElementById('admin-count').innerText = Object.keys(listA).length;
        }

        function addLog(m) {
            const l = document.getElementById('logs');
            if(l) { l.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${m}</div>`; l.scrollTop = l.scrollHeight; }
        }
    </script>
</body>
</html>
